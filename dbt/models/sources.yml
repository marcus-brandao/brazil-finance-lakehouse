version: 2

sources:
  - name: bronze
    schema: bronze
    tables:
      - name: sgs_raw
        config:
          # Every envelope field is a string, so freshness uses the file timestamp
          # Auto Loader records. Ingest rewrites current-year files every day.
          loaded_at_field: source_file_modification_time
          freshness:
            warn_after: {count: 26, period: hour}
            error_after: {count: 48, period: hour}
        columns:
          - name: series_code
            data_tests: [not_null]
          - name: payload
            data_tests: [not_null]
      - name: ptax_raw
        config:
          # Same as sgs_raw: the envelope fields are strings. Ingest rewrites the
          # current-year file every day, weekends included, so the check does not
          # trip on non-business days.
          loaded_at_field: source_file_modification_time
          freshness:
            warn_after: {count: 26, period: hour}
            error_after: {count: 48, period: hour}
        columns:
          - name: window_start
            data_tests: [not_null]
          - name: payload
            data_tests: [not_null]
      - name: cvm_inf_diario_raw
        config:
          # Every column is a string. Ingest runs weekly for CVM and rewrites the
          # current month, so a file older than a week and a day means a missed run.
          loaded_at_field: source_file_modification_time
          freshness:
            warn_after: {count: 8, period: day}
            error_after: {count: 15, period: day}
        columns:
          # The CNPJ column has a different name in each layout, so it has no test.
          - name: DT_COMPTC
            data_tests: [not_null]
          - name: source_file_path
            data_tests: [not_null]
