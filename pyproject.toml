[project]
name = "brazil-finance-lakehouse"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "databricks-sdk>=0.100",
    "httpx>=0.28.1",
]

[dependency-groups]
dbt = [
    "dbt-databricks>=1.13.1",
]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
pythonpath = [".", "databricks"]
addopts = "--cov"

[tool.coverage.run]
source = ["ingestion", "databricks"]

[tool.coverage.report]
# Total is 96% at the end of M1. The floor leaves room for small scripts without tests.
fail_under = 90
